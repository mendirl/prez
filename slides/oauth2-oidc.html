# OAuth2 et OpenID Connect

## Démonstration avec Keycloak et Spring Boot

---

class: compact

## Objectif

Séparer les responsabilités de sécurité, plutôt que de les réimplémenter dans chaque application.

| Acteur | Responsabilité |
|---|---|
| **Keycloak** | authentifie, porte le SSO et émet les jetons |
| **Client** | demande l'accès à une API ou connecte l'utilisateur |
| **Resource server** | valide le jeton et décide l'accès à sa ressource |

OAuth2 délègue l'**autorisation** d'accès aux APIs ; OIDC ajoute l'**identité** de l'utilisateur authentifié.

Le projet illustre ces rôles dans trois situations :

- **Client Credentials** : `client-service` agit seul, de machine à machine ;
- **Authorization Code + PKCE + OIDC** : `frontend-vue-service` connecte l'utilisateur ; `frontend-htmx-service` illustre l'alternative BFF ;
- **Token Exchange** : `client-service` obtient un jeton adapté pour agir au nom de cet utilisateur.

---

class: compact

## OAuth2 ou OIDC ?

| | OAuth2 | OpenID Connect (OIDC) |
|---|---|---|
| But | Déléguer l'accès à une API | Authentifier et identifier l'utilisateur |
| Jeton principal | `access token` | `ID token`, en plus de l'`access token` |
| Destinataire | **API / resource server** | **Client** qui a initié la connexion |
| Question | « Cette API peut-elle être appelée ? » | « Qui vient de se connecter ? » |

Demander le scope `openid` active OIDC et permet de recevoir un `ID token`. Dans ce projet, les `access tokens` sont des JWT émis par Keycloak et transmis aux APIs ; l'`ID token` sert au client à établir la session et **ne doit pas** autoriser un appel d'API.

---

class: compact

## Les composants de la démonstration

```
                           ┌──────────────┐
                           │   Keycloak   │
                           │    :8080     │
                           └──────┬───────┘
              ┌──────────────────┼──────────────────┐
              │                  │                  │
         OAuth2 / OIDC       OAuth2 / OIDC     OAuth2 / OIDC
              │                  │                  │
              ▼                  ▼                  ▼
       client-service   frontend-vue-service   frontend-htmx-service
           :8082               :8084                  :8083

       Keycloak ───────────── JWKS ───────────► resource-server :8081
```

- **Keycloak** : authorization server et fournisseur OIDC ;
- **frontend-vue-service** : SPA Vue.js, client OIDC public dans le navigateur ;
- **frontend-htmx-service** : alternative web Thymeleaf/HTMX avec session côté serveur ;
- **client-service** : client machine-à-machine et intermédiaire ;
- **resource-server** : API protégée qui valide les JWT.

---

class: compact

## Le JWT reçu par l'API

Un jeton contient notamment :

```json
{
  "iss": "http://localhost:8080/realms/demo",
  "sub": "...",
  "azp": "frontend-vue-service",
  "realm_access": { "roles": ["USER", "ADMIN"] }
}
```

Le `resource-server` vérifie la signature grâce aux clés publiques (JWKS) de Keycloak, puis transforme les rôles en autorités Spring : `ROLE_USER`, `ROLE_ADMIN`.

---

## JWT — trois parties lisibles

Un JSON Web Token est une chaîne composée de trois blocs encodés en Base64URL :

```text
eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9
             .
eyJpc3MiOiJodHRwOi8vLi4uIiwic3ViIjoiLi4uIn0
             .
RsaSignature...
     header             payload              signature
```

- le **header** indique notamment l'algorithme (`alg`) et l'identifiant de clé (`kid`) ;
- le **payload** porte les *claims* : identité, client, droits et dates ;
- la **signature** relie les deux premiers blocs à la clé privée de Keycloak.

Encodé ne veut pas dire chiffré : toute personne qui possède le token peut lire son header et son payload. Seul Keycloak peut produire une signature valable.

---

class: compact

## Access token — claims utiles dans ce projet

```json
{
  "iss": "http://localhost:8080/realms/demo",
  "sub": "identifiant-stable-du-sujet",
  "aud": ["client-service"],
  "azp": "frontend-vue-service",
  "exp": 1760000000,
  "scope": "openid profile email",
  "realm_access": { "roles": ["USER", "ADMIN"] }
}
```

| Claim | Rôle |
|---|---|
| `iss` | émetteur attendu : le realm Keycloak `demo` |
| `sub` | sujet : utilisateur ou compte de service |
| `aud` / `azp` | destinataire(s) / client qui a obtenu le token |
| `iat`, `nbf`, `exp` | émis à, valide à partir de, expiration (timestamps Unix) |
| `scope`, `realm_access.roles` | permissions OAuth2 et rôles Keycloak |

Les claims effectivement présents dépendent du flow, des scopes et des mappers du client.

---

## Ne pas confondre les jetons

| Jeton | Destinataire et usage | Ne doit pas servir à |
|---|---|---|
| **Access token** | API / resource server ; transmis dans `Authorization: Bearer ...` | être confondu avec une preuve d'identité UI |
| **ID token** | client OIDC ; identité de l'utilisateur (`sub`, nom, e-mail...) | autoriser un appel API |
| **Refresh token** | client OAuth2 ; obtenir de nouveaux jetons | être envoyé à une API ou stocké durablement dans le navigateur |

Dans la SPA Vue, les jetons restent en mémoire : l'ID token sert à présenter l'identité et l'access token aux appels API. Dans Client Credentials, il n'y a pas d'utilisateur ni d'ID token : le `sub` représente le compte de service.

---

## Validation JWT — qui fait quoi ?

```text
Bearer <JWT> ─► resource-server / client-service
                     │
                     ├─ découvre la configuration OIDC depuis issuer-uri
                     ├─ récupère les clés publiques JWKS de Keycloak
                     ├─ choisit la clé indiquée par le header kid
                     ├─ vérifie cryptographiquement la signature
                     └─ contrôle iss, nbf et exp avant d'authentifier la requête
```

La propriété commune aux deux services est :

```yaml
spring.security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:8080/realms/demo
```

Un token expiré, émis par un autre realm, altéré, ou signé avec une clé inconnue est rejeté avant l'exécution des contrôleurs.

---

## Validation JWT — des claims aux droits Spring

Après validation, Spring remet un objet `Jwt` au contrôleur et calcule les autorités :

```text
scope: "openid profile"          ─► SCOPE_openid, SCOPE_profile
realm_access.roles: ["ADMIN"]    ─► ROLE_ADMIN
```

Les `SecurityConfig` de `resource-server` et `client-service` lisent explicitement `realm_access.roles` et préfixent chaque rôle par `ROLE_`.

| Règle dans `resource-server` | Autorité attendue |
|---|---|
| `/api/user/**` | `ROLE_USER` ou `ROLE_ADMIN` |
| `/api/admin/**` | `ROLE_ADMIN` |

La signature établit que les claims sont intègres ; les règles Spring décident ensuite si ces claims donnent accès à la ressource demandée.

---

## Audience : protection supplémentaire à prévoir

La claim `aud` indique les destinataires prévus du token. Pour le Token Exchange, le mapper de chacun des frontends ajoute bien `client-service` à `aud` dans l'**access token** : Keycloak exige cette audience avant l'échange.

Dans l'état actuel du code, les resource servers valident l'émetteur, la signature et les dates via `issuer-uri`, mais ne configurent pas de contrôle applicatif supplémentaire de `aud`.

À ajouter dans une application exposée : un validateur Spring qui exige l'audience de l'API ciblée. Cela évite qu'un access token valable pour une autre API soit accepté par erreur.

---

## Lire un JWT sans lui faire confiance

On peut décoder localement les deux premières parties pour diagnostiquer un token :

```text
Base64URL(header) . Base64URL(payload) . signature
```

Cela permet de vérifier visuellement `iss`, `aud`, `exp`, `scope` et `realm_access.roles`, mais **ne prouve rien**. Le résultat n'est exploitable pour l'autorisation qu'après validation de la signature et des claims par le resource server.

Ne pas coller un access token réel dans un site tiers : c'est un secret de type Bearer. Toute personne qui le détient peut l'utiliser jusqu'à son expiration.

---

## Flow 1 — Client Credentials

Pour un appel **service à service**, sans utilisateur.

```
client-service ── client_id + secret ──► Keycloak
       │              access token              │
       └──────── Bearer JWT ────────────────► resource-server
```

Dans l'exemple :

```text
GET http://localhost:8082/client/call
```

`client-service` obtient son propre jeton puis appelle `/api/message`.

---

## Client Credentials — échanges

```text
 Consommateur       client-service              Keycloak             resource-server
      │                    │                       │                       │
      ├─ GET /client/call ─►                       │                       │
      │                    ├─ POST /token ─────────►                       │
      │                    │  grant_type=client_credentials                │
      │                    │  client_id + client_secret                    │
      │                    ◄─ access_token (JWT service) ─┤                │
      │                    │                                               │
      │                    ├─ GET /api/message ───────────────────────────►
      │                    │  Authorization: Bearer <JWT service>          │
      │                    │                                               ├─ JWKS ─► Keycloak
      │                    │                                               ◄───────── clés publiques
      │                    ◄─ réponse API ─────────────────────────────────┤
      ◄─ réponse API ──────┤                       │                       │
```

Le secret est utilisé uniquement entre `client-service` et Keycloak ; le JWT de service est ensuite présenté à l'API.

---

class: compact

## Client Credentials — 1. Déclenchement

Un consommateur appelle l'endpoint public de démonstration :

```text
GET http://localhost:8082/client/call
```

Dans `client-service`, un intercepteur `RestClient` prépare l'appel vers
`resource-server` et demande un jeton pour la registration `client-credentials`.

- principal technique : `client-service` ;
- client Keycloak : `client-service` ;
- pas de navigateur, pas de session, pas d'utilisateur.

---

## Client Credentials — 2. Émission du jeton

`client-service` appelle le endpoint `.../protocol/openid-connect/token` de Keycloak :

```text
grant_type=client_credentials
client_id=client-service
client_secret=••••••••
```

Keycloak authentifie le **client confidentiel** et vérifie que son *service account* est activé. Il renvoie un *access token* JWT qui représente le service, pas un utilisateur.

Le client et son secret ne quittent jamais le backend `client-service`.

---

## Client Credentials — 3. Appel et contrôle

```
client-service ── Authorization: Bearer <JWT service> ──► GET /api/message
                                                          resource-server
```

1. `resource-server` charge les clés publiques JWKS depuis l'issuer Keycloak.
2. Il vérifie signature, expiration et émetteur du JWT.
3. `/api/message` exige seulement une authentification : l'appel est accepté.
4. La réponse expose notamment le `sub`, le `azp`, les scopes et les rôles du JWT.

Ce flux convient à une tâche planifiée, un backend ou une intégration sans personne connectée.

---

## Authorization Code sans PKCE : le flow historique

```text
Navigateur ── /authorize ──► Keycloak
     │                          │
     ◄── callback?code=... ─────┘
     │
Client ── code + client_secret ──► /token ──► access token
```

- le code est ramené par le navigateur, puis échangé contre les jetons ;
- un **client confidentiel** prouve son identité avec son `client_secret` ;
- sans PKCE, quiconque intercepte le code et peut s'authentifier comme le client peut tenter de l'échanger.

**Avec PKCE**, le client crée un `code_verifier` secret avant la redirection et n'envoie que son empreinte (`code_challenge`) à Keycloak. Lors de l'échange, le verifier est exigé : un code intercepté seul devient inutilisable.

| Sans PKCE | Avec PKCE |
|---|---|
| Code lié au client | Code lié au client **et** à la preuve créée pour cette autorisation |
| Risque accru pour SPA, mobile et client public | Recommandé pour tous les clients, indispensable pour les clients publics |

---

## Flow 2 — Authorization Code + PKCE + OIDC

Pour la connexion d'un utilisateur dans le navigateur.

```text
navigateur : Vue.js + keycloak-js ──► Keycloak
              ▲                         │
              └── callback?code&state ──┘
                      │
          access token + ID token en mémoire
```

- Vue appelle `keycloak.login()` et le navigateur est redirigé vers Keycloak ;
- Keycloak renvoie un **code** au callback de la SPA ;
- `keycloak-js` échange le code contre les jetons directement dans le navigateur ;
- PKCE relie le code au navigateur via `code_verifier` / `code_challenge` (S256).

---

class: flow-diagram

## Authorization Code + PKCE — échanges

```text
 Navigateur : Vue.js + keycloak-js            Keycloak             resource-server
                 │                                │                       │
                 ├─ /authorize?code_challenge ───►│                       │
                 │                                │                       │
                 │     authentification utilisateur                        │
                 ◄─ callback?code&state ──────────┤                       │
                 ├─ POST /token : code + code_verifier ───────►│         │
                 ◄─ ID token + access token ───────────────────┤         │
                 ├─ fetch : Bearer <access token> ───────────────────────►│
                 ◄─ réponse API ──────────────────────────────────────────┤
```

Le navigateur ne possède pas de `client_secret` : `frontend-vue-service` est un client public. Il conserve le `code_verifier` pour l'échange, puis les tokens uniquement en mémoire.

---

class: compact

## `state`, `nonce` et PKCE : trois protections complémentaires

| Mécanisme | Envoyé à Keycloak | Vérification côté client | Protège contre |
|---|---|---|---|
| `state` | Demande `/authorize` | Même valeur au callback | Réponse non sollicitée / CSRF |
| `nonce` | Demande `/authorize` | Même valeur dans l'`ID token` | Rejeu ou substitution d'`ID token` |
| PKCE | `code_challenge` (`S256`) | `code_verifier` à `/token` | Interception du `authorization code` |

```text
Client : conserve state, nonce et code_verifier
    │
    ├── /authorize?state&nonce&code_challenge ──► Keycloak
    ◄── callback?code&state ─────────────────────┤
    └── /token : code + code_verifier ──────────► Keycloak
         ◄── ID token contenant le nonce ────────┤
```

- `state` associe le retour navigateur à la demande initiée ;
- `nonce` est une protection **OIDC** : il lie l'`ID token` à cette authentification ;
- le `code_verifier` reste secret et n'est jamais envoyé à `/authorize`.

Pour Authorization Code + OIDC, utiliser les trois mécanismes : aucun ne remplace les deux autres.

---

## Authorization Code — 1. Redirection vers Keycloak

L'utilisateur ouvre la SPA `frontend-vue-service` et choisit de se connecter.

1. Le bouton Vue appelle `keycloak.login()`.
2. `keycloak-js` construit la demande : `client_id=frontend-vue-service`, URI de retour et scopes `openid profile email`.
3. L'adaptateur génère un `state`, un `nonce`, un `code_verifier` secret et le `code_challenge` dérivé en `S256`.
4. Le navigateur est redirigé vers Keycloak avec le challenge, mais **jamais** avec le verifier.

Le `state` protège le retour contre une réponse d'autorisation non sollicitée ; le `nonce` lie l'ID token ; PKCE protège le code intercepté.

---

## Authorization Code — 2. Login puis code à usage unique

```
navigateur ──► Keycloak : authentification alice / bob
     │
     └── 302 vers http://localhost:8084/?code=...&state=... ──► SPA Vue.js
```

- Keycloak authentifie l'utilisateur et porte ses rôles `USER` / `ADMIN` dans le realm `demo`.
- Il vérifie l'URI de redirection déclarée pour `frontend-vue-service`.
- Il délivre un **authorization code** court, à usage unique ; aucun JWT n'est encore visible dans l'URL de retour.

---

## Authorization Code — 3. Échange protégé dans la SPA

Après le callback, `keycloak-js` échange le code auprès de Keycloak depuis le navigateur :

```text
grant_type=authorization_code
code=...
redirect_uri=http://localhost:8084/
client_id=frontend-vue-service
code_verifier=...
```

Après validation du code, du client et de PKCE, Keycloak renvoie :

| Jeton | Usage dans l'exemple |
|---|---|
| *ID token* | identité OIDC affichée par la SPA |
| *Access token* | appels `fetch` Bearer vers `resource-server` et `client-service` |
| *Refresh token* | renouvellement en mémoire géré par `keycloak-js` |

---

## Authorization Code + PKCE — SPA Vue.js

`frontend-vue-service` est un **client public** : l'adaptateur Keycloak est exécuté dans le navigateur, sans `client_secret`.

```text
 Navigateur : Vue.js + keycloak-js                 Keycloak
             │                                       │
             ├─ /authorize?client_id&state&nonce ───►│
             │   &code_challenge=S256                │
             │                                       │
             ◄─ /vue/?code=...&state=... ───────────┤
             │                                       │
             ├─ /token : code + code_verifier ─────►│
             ◄─ ID token + access token ────────────┤
             │
             └─ Bearer <access token> ──► APIs
```

- le bouton de connexion appelle `keycloak.login()` ;
- `keycloak-js` crée et conserve `state`, `nonce` et le `code_verifier` ;
- après le callback vers la racine de la SPA (`/` ou `/vue/` via Ingress), il vérifie la réponse et échange le code directement depuis le navigateur ;
- les tokens restent en mémoire dans la SPA : ne pas les stocker dans `localStorage`.

---

class: compact

## SPA Vue.js — identité, renouvellement et appels directs

| Étape | Ce que fait `frontend-vue-service` |
|---|---|
| Initialisation | Charge `/spa-config.json`, puis `keycloak.init({ onLoad: 'check-sso', pkceMethod: 'S256' })` |
| Identité | Lit les claims de l'`access token` (`preferred_username`, `realm_access.roles`) et affiche l'`ID token` |
| Renouvellement | Appelle `updateToken(30)` avant une requête pour renouveler le jeton bientôt expiré |
| API | Utilise `fetch` avec `Authorization: Bearer <access token>` vers `resource-server` ou `client-service` |

```text
Vue.js dans le navigateur ── Bearer <access token> ──► resource-server
                                                        └─ validation JWT + RBAC
                          ── Bearer <access token> ──► client-service
                                                        └─ validation JWT + RBAC
```

Les APIs autorisent l'origine de la SPA via CORS, mais conservent la validation du JWT et les rôles : le contrôle de l'interface Vue ne remplace jamais celui du serveur.

---

## Authorization Code — 4. Rôles et appels API

La SPA Vue lit les rôles dans son **access token** en mémoire et affiche les zones `USER` / `ADMIN`. Avant chaque appel, `keycloak-js` renouvelle le token si nécessaire.

```
Vue.js dans le navigateur ── Bearer <access token utilisateur> ──► resource-server
```

- `/api/user/profile` accepte `USER` ou `ADMIN` ;
- `/api/admin/dashboard` exige `ADMIN` ;
- l'affichage conditionnel de Vue améliore l'interface, mais le serveur prend toujours la décision d'autorisation.

`frontend-htmx-service` est l'alternative BFF : Spring y conserve la session et appelle les APIs à la place du navigateur.

---

## Les rôles pilotent l'accès

| Endpoint API | Accès |
|---|---|
| `/api/public/hello` | public |
| `/api/message` | utilisateur authentifié |
| `/api/user/profile` | `USER` ou `ADMIN` |
| `/api/admin/dashboard` | `ADMIN` |

Vue lit les rôles Keycloak dans `realm_access.roles` pour afficher les actions disponibles ; Spring Security les mappe côté APIs.

Une action masquée dans la SPA n'est pas une protection : `resource-server` impose `ROLE_USER` / `ROLE_ADMIN` à chaque requête Bearer.

---

## Flow 3 — Token Exchange (RFC 8693)

Un service agit **au nom de l'utilisateur** sans transmettre son jeton tel quel jusqu'à l'API.

```
utilisateur → SPA Vue.js → client-service → Keycloak
                                │              │
                                └─ nouveau JWT ┘
                                       │
                                       ▼
                                 resource-server
```

`client-service` échange le jeton utilisateur contre un nouveau jeton dont il est l'audience, tout en conservant l'utilisateur représenté.

---

class: flow-diagram

## Token Exchange RFC 8693 — échanges

```text
 Navigateur : Vue.js                client-service           Keycloak          resource-server
        │                                 │                    │                    │
        ├─ fetch /client/call-as-user ────►│                    │                    │
        │  Bearer <access token utilisateur>│                   │                    │
        │                                 ├─ valide le JWT     │                    │
        │                                 ├─ POST /token ────► │                    │
        │                                 │  grant_type=token-exchange              │
        │                                 │  subject_token=<JWT utilisateur>        │
        │                                 ◄─ access_token échangé ─┤                │
        │                                 │                    │                    │
        │                                 ├─ Bearer <JWT échangé> ─────────────────►│
        │                                 ◄─ réponse selon rôles ───────────────────┤
        ◄─ réponse JSON ──────────────────┤                    │                    │
```

Le jeton entrant sert de preuve de la délégation ; seul le nouveau jeton, contrôlé pour cette relation de confiance, atteint `resource-server`.

---

## Token Exchange — 1. Transmission contrôlée

Depuis l'action Vue « Token Exchange », le navigateur récupère l'*access token* en mémoire et l'envoie directement à `client-service` :

```text
GET /client/call-as-user
Authorization: Bearer <access token de l'utilisateur>
```

`client-service` est aussi un **resource server** : avant tout échange, Spring valide ce Bearer (issuer, signature, expiration) et reconstruit les autorités à partir des rôles Keycloak. CORS autorise l'origine de la SPA, sans remplacer cette validation.

Sans Bearer valide, `/client/call-as-user` n'est pas accessible.

---

## Token Exchange — 2. Demande RFC 8693

Le manager OAuth2 dédié utilise la registration `token-exchange` de `client-service` et appelle Keycloak avec :

```text
grant_type=urn:ietf:params:oauth:grant-type:token-exchange
subject_token=<JWT utilisateur entrant>
subject_token_type=urn:ietf:params:oauth:token-type:access_token
client_id=client-service
client_secret=••••••••
```

Le `subject_token` est enveloppé comme *access token* explicitement : cette précision est nécessaire pour l'endpoint Token Exchange de Keycloak 25.

---

## Token Exchange — 3. Autorisation de l'échange

Keycloak n'autorise pas n'importe quel service à échanger le jeton d'un utilisateur.

1. `client-service` est le *requester* et son Token Exchange est activé dans le realm.
2. Le jeton source de l'un des frontends doit contenir `client-service` dans sa claim `aud`.
3. Le mapper d'audience Keycloak de chaque frontend ajoute cette audience à l'*access token* — pas à l'ID token.
4. Keycloak émet alors un nouveau JWT, destiné à `client-service`, qui représente toujours l'utilisateur.

Cette audience évite qu'un client tiers puisse utiliser un jeton qui ne lui est pas destiné.

---

## Token Exchange — 4. Appel final au nom de l'utilisateur

```
client-service ── Bearer <JWT échangé> ──► resource-server
```

`client-service` examine les rôles du jeton entrant pour choisir la ressource :

| Rôles de l'utilisateur | Endpoint appelé avec le jeton échangé |
|---|---|
| `ADMIN` | `/api/admin/dashboard` |
| `USER` sans `ADMIN` | `/api/user/profile` |

Le `resource-server` valide à nouveau ce **nouveau** JWT et applique ses règles RBAC. Le token initial n'est donc pas propagé tel quel jusqu'à l'API finale.

---

## Démonstration proposée

1. Démarrer Keycloak et les quatre services.
2. Appeler `http://localhost:8082/client/call` : flux machine-à-machine.
3. Ouvrir `http://localhost:8084` (SPA Vue.js) et se connecter avec :
   - `alice` / `alice` : rôles `USER`, `ADMIN` ;
   - `bob` / `bob` : rôle `USER`.
4. Comparer les accès aux zones utilisateur et administrateur.
5. Depuis Vue, déclencher l'action « Token Exchange » et observer la réponse JSON.

L'alternative BFF est disponible sur `http://localhost:8083` avec `frontend-htmx-service`.

---

## À retenir

- OAuth2 délègue l'accès ; OIDC ajoute l'identité.
- Le choix du flow dépend du contexte : service, navigateur, délégation.
- Un access token ne suffit pas : l'API valide son émetteur, sa signature et les rôles requis.
- Les secrets et jetons sont des données sensibles : ceux du projet sont réservés à la démonstration.

---

## API gateway — point d'entrée, pas fournisseur d'identité

```text
Navigateur / client ──► API gateway ──┬──► frontend-vue-service  :8084
                                      ├──► frontend-htmx-service :8083
                                      ├──► client-service        :8082
                                      └──► resource-server       :8081
          gateway ── découverte OIDC / JWKS ──► Keycloak :8080
```

La gateway expose les routes publiques et applique les politiques transverses :

- terminaison **TLS**, routage et réécriture d'URL ;
- **CORS**, limites de débit et protections contre les abus ;
- authentification en bordure et validation initiale du token ;
- journalisation, métriques et traces homogènes.

Keycloak reste l'authorization server et le fournisseur OIDC : la gateway ne remplace ni la page de connexion ni l'émission des jetons.

---

class: compact

## API gateway — éléments de mise en place

1. **Définir les routes exposées** vers les deux frontends, `client-service` et `resource-server`, puis appliquer TLS, CORS et limites de débit par route.
2. **Configurer OIDC** : registration du client, URI de callback exacte, `issuer` et découverte des clés JWKS chez Keycloak.
3. **Choisir la validation** : JWT local (signature, issuer, dates et audience) ou introspection selon le type de token et le besoin de révocation immédiate.
4. **Transmettre de façon contrôlée** le `Authorization: Bearer` ou des informations minimales vers les services ; ne jamais faire confiance à des headers d'identité venant du client.
5. **Rendre observable** : logs d'accès, refus d'authentification, métriques de débit/latence et traces corrélées.

Ces choix sont indépendants du produit de gateway retenu ; ils complètent les clients OIDC et les resource servers existants.

---

class: compact

## Défense en profondeur — responsabilités partagées

| Gateway | Services protégés |
|---|---|
| Routes, TLS, CORS, limites de débit et politiques communes | Décision d'accès à la ressource et règles métier |
| Peut rejeter tôt un token invalide | Valident à nouveau signature, issuer, expiration et audience attendue |
| Transmet uniquement le contexte nécessaire | Appliquent scopes et RBAC (`realm_access.roles`) |

Même avec une gateway, `resource-server` et `client-service` restent des **resource servers** : leurs `SecurityConfig` utilisent `issuer-uri`, vérifient les JWT et convertissent les rôles Keycloak en autorités Spring.

Ainsi, un accès interne qui contournerait la gateway ne devient pas implicitement fiable. La gateway renforce la frontière externe ; elle ne remplace jamais les autorisations métier dans les services.
